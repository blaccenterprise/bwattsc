<!DOCTYPE html>
<html>
<head>
<title>MATH PORTAL</title>
<style>
/* General body styles */
body {
  overflow: hidden;
  margin: 0;
  padding: 0;
    background-color: #000;
}

/* Reset margins and paddings for all elements */
* {
  margin: 0px;
  padding: 0px;
}

    
.glow {
  font-size: 80px;
  text-align: center;
  animation: glow 3s ease-in-out infinite alternate;
}

@-webkit-keyframes glow {
  from {
    text-shadow: 50px 20px 30px #000000, 30px 20px 60px #000000, 50px 20px 30px #000000, 10px 30px 60px #000000, 30px 30px 30px #000000, 50px 30px 60px red, 70px 20px 30px #000000;
  }
  
  to {
    text-shadow: 40px 30px 60px #FFFFFF, 50px 10px 40px #FFFFFF, 10px 10px 50px red, 10px 40px 60px #FFFFFF, 50px 10px 70px #FFFFFF, 60px 10px 80px red, 40px 10px 90px #FFFFFF;
  }
}


    
    
/* Styling the container for the color picker */
#colPick {
  color: #333; /* Text color */
  font-weight: bold; /* Bold font */
  font-family: Arial, Helvetica, sans-serif; /* Font style */
  background: rgba(255, 255, 255, 0.5); /* Semi-transparent white background */
  width: 240px; /* Fixed width */
  padding: 0.5em 1em; /* Padding inside the container */
  border-radius: 4px; /* Rounded corners */
  position: absolute; /* Positioned relative to the viewport */
  left: 50%; /* Horizontally centered */
  top: 50%; /* Vertically centered */
  box-sizing: border-box; /* Include padding and border in width/height */
  margin-left: -120px; /* Adjust horizontal centering */
  margin-top: -80px; /* Adjust vertical centering */
  box-shadow: 0px 0px 8px rgba(0, 0, 0, 0.1); /* Light shadow for depth */
}

/* Styling the range inputs for RGB sliders */
input {
  width: 180px; /* Set the width of the slider */
  margin: 0 0 0 9px; /* Add left margin for alignment */
  padding: 0; /* Remove padding */
  top: 5px; /* Adjust vertical alignment */
  position: relative; /* Position relative to its container */
}

/* Panel at the bottom for controls */
#controlPanel {
  position: absolute;
  bottom: 0;
  left: 0;
  height: 30px;
  display: flex;
  width: 100%;
  justify-content: flex-start;
  align-items: center;
  background: linear-gradient(330deg,#00000080, grey); 
}

/* Panel at the bottom for controls */
#colorPicker {
  position: absolute;
  bottom: 0;
  left: 0;
  height: 30px;
  display: flex;
  width: 100%;
  justify-content: flex-start;
  align-items: center;
  background: linear-gradient(330deg,#00000080, grey); 
}

/* Individual color buttons in the palette */
.colorButton {
  width: 30px;
  height: 30px;
  margin-right: 5px;
  border: none;
  cursor: pointer;
    overflow-y:auto;
}

/* Clear button styles */
#clearButton {
  width: 10vw;
  height: 30px;
  margin-left: 205px;
  background: linear-gradient(330deg,#00000080, red); 
  border: none;
  cursor: pointer;
  font-size:17px;
}

/* Canvas area styles */
#drawingCanvas {
  background-color: #fff;
  position: absolute;
  top: 30px;
  width: 100%;
  height: calc(100% - 30px);
}

/* Line width selector styles */
#lineWidthSlider {
  width: 74vw;
  margin: 0px 3vw;
    
}

/* Color palette container */
#colorPalette {
  overflow-y: auto;
  height: 100%;
    position: fixed;
  top: 0;
  padding: 5px 0;
  background-color: #333; /* Background color for the color palette */
}

/* Color palette container */
#apps {
  display: flex;
  overflow-y: auto;
  width: 100px;
    height: 790px;
  position: absolute;
  top: 33px;
  padding: 0px 0;
  left:0; 
    margin-right: 10px;
  background-color: #000; /* Background color for the color palette */
}

/* Color palette container */
.actiontab {
  display: fixed;
  overflow-y: auto;
  width: 180px;
  position: absolute;
  top: 30px;
  padding: 5px 0;
  background: linear-gradient(330deg,#00000080, black); 
    margin-left: 1710px;
    height: 100%;
        
    /* Background color for the color palette */
}

/* Button styles within the color palette */
#colorPalette button {
  flex-shrink: 0;
}
    
.btn-group button {
  background-color: #000000; /* Green background */
  border: 1px solid blue; /* Green border */
  color: white; /* White text */
  padding: 10px 24px; /* Some padding */
  cursor: pointer; /* Pointer/hand icon */
  width: 100px; /* Set a width if needed */
  display: block; /* Make the buttons appear below each other */
}

.btn-group button:not(:last-child) {
  border-bottom: none; /* Prevent double borders */
}

/* Add a background color on hover */
.btn-group button:hover {
  background-color: #000000;
}

    
.navbar {
  overflow: hidden;
  background: linear-gradient(330deg,#00000080, blue); 
  position: fixed;
  bottom: 0;
  margin-bottom: 30px;
  width: 100%;
    height: 105px;
    left: 0;
    margin-left:0px;
    color: orange
}

.navbar a {
  float: left;
  display: block;
  color: orange;
  text-align: center;
  padding: 14px 8px;
  text-decoration: none;
  font-size: 17px;
}

.navbar a:hover {
  background: teal;
  color: purple;
}

.navbar a.active {
  background-color: teal;
  color: orange;
}

    }

.sidebar {
  height: 100%;
  width: 0;
  position: fixed;
  z-index: 1;
  top: 0;
  right: 0;
  background-color: #000;
  overflow-x: hidden;
  transition: 0.5s;
  padding-top: 60px;
}

.sidebar a {
  padding: 8px 8px 8px 32px;
  text-decoration: none;
  font-size: 25px;
  color: #818181;
  display: block;
  transition: 0.3s;
}

.sidebar a:hover {
  color: #f1f1f1;
}

.sidebar .closebtn {
  position: absolute;
  top: 0;
  left: 25px;
  font-size: 36px;
  margin-right: 50px;
}

.openbtn {
  font-size: 20px;
  cursor: pointer;
  background-color: #111;
  color: white;
  padding: 10px 15px;
  border: none;
}

.openbtn:hover {
  background-color: #444;
}

#main {
  transition: margin-left .5s;
  padding: 16px;
}

/* On smaller screens, where height is less than 450px, change the style of the sidenav (less padding and a smaller font size) */
@media screen and (max-height: 450px) {
  .sidebar {padding-top: 15px;}
  .sidebar a {font-size: 18px;}
}
</style>

/* Add an event listener to update the background color on input change */

/* Function to update the background color based on slider values */
function changeCol(e) {
  gblR = colR.value; // Get the Red value
  gblG = colG.value; // Get the Green value

  /* Set the background color of the page */
  document.body.style.backgroundColor = "rgb(" + gblR + "," + gblG + "," + gblB + ")";
  
  /* Display the current RGB value */
  document.getElementById("colortext").innerHTML = "rgb(" + gblR + "," + gblG + "," + gblB + ")";
}
</script>

// Initialize the canvas and controls
function initializeCanvas() {
  // Set the canvas size based on window dimensions
  canvasHeight = window.innerHeight;
  canvasWidth = window.innerWidth;
  canvas = document.getElementById("drawingCanvas");
  controlPanel = document.getElementById("controlPanel");
  ctx = canvas.getContext("2d");
  canvas.width = canvasWidth;
  offsetTop = canvas.getBoundingClientRect().top;
  canvas.height = canvasHeight - offsetTop;

  // Add event listeners for touch events
  canvas.addEventListener("touchstart", startDrawing, false);
  canvas.addEventListener("touchend", stopDrawing, false);
  canvas.addEventListener("touchcancel", stopDrawing, false);
  canvas.addEventListener("touchleave", stopDrawing, false);
  canvas.addEventListener("touchmove", handleTouchMove, false);

  // Populate the color palette dynamically
  var colorPalette = document.getElementById("colorPalette");
  for (var i = 0; i < colors.length; i++) {
    var button = document.createElement("button");
    button.className = "colorButton";
    button.style.backgroundColor = colors[i];
    button.onclick = function() { changeColor(this); };
    colorPalette.appendChild(button);
  }

  // Set initial line width and color
  ctx.lineWidth = 1;
  ctx.strokeStyle = "#000000";
  ctx.lineCap = "round";
}

// Handle touch move event
function handleTouchMove(e) {
  if (isDrawing) {
    var touches = e.changedTouches;
    var x = getMousePosition(touches[0]).x;
    var y = getMousePosition(touches[0]).y;
    if (prevX != -1 && prevY != -1) draw(prevX, prevY, x, y);
    prevX = x;
    prevY = y;
  }  
}

// Start drawing on mouse or touch start
function startDrawing() {
  isDrawing = true;
}

// Change the width of the drawing line
function changeLineWidth(width) {
  ctx.lineWidth = width;
}

// Clear the canvas
function clearCanvas() {
  ctx.clearRect(0, 0, canvasWidth, canvasHeight);
}

// Change the stroke color when a color button is clicked
function changeColor(button) {
  ctx.strokeStyle = window.getComputedStyle(button, null).getPropertyValue('background-color');
}

// Stop drawing on mouse or touch up
function stopDrawing() {
  isDrawing = false;
  prevX = -1;
  prevY = -1;
}

// Get the mouse or touch position relative to the canvas
function getMousePosition(e) {
  return {
    x: e.clientX,
    y: e.clientY - offsetTop
  };
}

// Draw a line on the canvas
function draw(sx, sy, ex, ey) {
  ctx.beginPath();
  ctx.moveTo(sx, sy);
  ctx.lineTo(ex, ey);
  ctx.stroke();
  ctx.closePath();
}

// Handle mouse move event for drawing
function drawLine(e) {
  if (isDrawing) {
    var x = getMousePosition(e).x;
    var y = getMousePosition(e).y;
    if (prevX != -1 && prevY != -1) draw(prevX, prevY, x, y);
    prevX = x;
    prevY = y;
  }
}

 <style>
     
.calculator {
    width:  400px;
    max-width: 400px;
    background-color: var(--bg-color);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 10px 30px var(--shadow-color);
}

.display {
    padding: 20px;
    text-align: right;
    background-color: var(--display-color);
    margin: 10px;
    border-radius: 10px;
}

.previous-operand {
    min-height: 24px;
    font-size: 1rem;
    color: rgba(var(--text-color), 0.7);
    overflow-wrap: break-word;
}

.current-operand {
    min-height: 40px;
    font-size: 2rem;
    font-weight: bold;
    overflow-wrap: break-word;
}

.buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    padding: 20px;
}

button {
    border: none;
    outline: none;
    padding: 15px 10px;
    font-size: 1.2rem;
    border-radius: 10px;
    cursor: pointer;
    background-color: var(--button-color);
    color: var(--text-color);
    box-shadow: 0 4px 6px var(--shadow-color);
}

button:active {
    transform: scale(0.95);
}

button[data-action="operation"] {
    background-color: var(--operation-color);
    color: white;
}

button[data-action="function"] {
    background-color: var(--function-color);
    color: white;
    font-size: 1rem;
}

button[data-action="equals"] {
    background-color: var(--operation-color);
    color: white;
}

button[data-action="clear"],
button[data-action="delete"] {
    background-color: #ff3b30;
    color: white;
}

.span-2 {
    grid-column: span 2;
}

@media (max-width: 400px) {
    button {
        padding: 12px 8px;
        font-size: 1rem;
    }
    
    button[data-action="function"] {
        font-size: 0.8rem;
    }
}

    <script>
        class Calculator {
    constructor(previousOperandElement, currentOperandElement) {
        this.previousOperandElement = previousOperandElement;
        this.currentOperandElement = currentOperandElement;
        this.clear();
    }

    clear() {
        this.currentOperand = '0';
        this.previousOperand = '';
        this.operation = undefined;
        this.resetScreen = false;
    }

    delete() {
        if (this.currentOperand.length === 1 || 
            (this.currentOperand.length === 2 && this.currentOperand.startsWith('-'))) {
            this.currentOperand = '0';
        } else {
            this.currentOperand = this.currentOperand.slice(0, -1);
        }
    }

    appendNumber(number) {
        if (this.resetScreen) {
            this.currentOperand = '0';
            this.resetScreen = false;
        }
        if (number === '.' && this.currentOperand.includes('.')) return;
        if (this.currentOperand === '0' && number !== '.') {
            this.currentOperand = number;
        } else {
            this.currentOperand += number;
        }
    }

    chooseOperation(operation) {
        if (this.currentOperand === '0' && this.previousOperand !== '') {
            this.operation = operation;
            return;
        }
        if (this.previousOperand !== '') {
            this.compute();
        }
        this.operation = operation;
        this.previousOperand = this.currentOperand;
        this.currentOperand = '0';
    }

    compute() {
        let computation;
        const prev = parseFloat(this.previousOperand);
        const current = parseFloat(this.currentOperand);
        
        if (isNaN(prev) || isNaN(current)) return;
        
        switch (this.operation) {
            case '+':
                computation = prev + current;
                break;
            case '-':
                computation = prev - current;
                break;
            case '×':
                computation = prev * current;
                break;
            case '÷':
                computation = prev / current;
                break;
            case 'x^y':
                computation = Math.pow(prev, current);
                break;
            default:
                return;
        }
        
        this.currentOperand = computation.toString();
        this.operation = undefined;
        this.previousOperand = '';
        this.resetScreen = true;
    }

    applyFunction(func) {
        const current = parseFloat(this.currentOperand);
        if (isNaN(current)) return;
        
        switch (func) {
            case 'sin':
                this.currentOperand = Math.sin(current * Math.PI / 180).toString();
                break;
            case 'cos':
                this.currentOperand = Math.cos(current * Math.PI / 180).toString();
                break;
            case 'tan':
                this.currentOperand = Math.tan(current * Math.PI / 180).toString();
                break;
            case 'sqrt':
                this.currentOperand = Math.sqrt(current).toString();
                break;
            case 'log':
                this.currentOperand = Math.log10(current).toString();
                break;
            case 'ln':
                this.currentOperand = Math.log(current).toString();
                break;
            case 'pi':
                this.currentOperand = Math.PI.toString();
                break;
            case 'e':
                this.currentOperand = Math.E.toString();
                break;
        }
        this.resetScreen = true;
    }

    addParenthesis(paren) {
        if (this.resetScreen) {
            this.currentOperand = '0';
            this.resetScreen = false;
        }
        if (this.currentOperand === '0') {
            this.currentOperand = paren;
        } else {
            this.currentOperand += paren;
        }
    }

    updateDisplay() {
        this.currentOperandElement.innerText = this.currentOperand;
        if (this.operation != null) {
            this.previousOperandElement.innerText = 
                `${this.previousOperand} ${this.operation}`;
        } else {
            this.previousOperandElement.innerText = this.previousOperand;
        }
    }
}

// DOM Elements
const numberButtons = document.querySelectorAll('[data-action="number"]');
const operationButtons = document.querySelectorAll('[data-action="operation"]');
const equalsButton = document.querySelector('[data-action="equals"]');
const clearButton = document.querySelector('[data-action="clear"]');
const deleteButton = document.querySelector('[data-action="delete"]');
const functionButtons = document.querySelectorAll('[data-action="function"]');
const parenButtons = document.querySelectorAll('[data-action="paren"]');
const decimalButton = document.querySelector('[data-action="decimal"]');
const previousOperandElement = document.querySelector('.previous-operand');
const currentOperandElement = document.querySelector('.current-operand');
const toggleModeButton = document.querySelector('[data-action="toggle-mode"]');

const calculator = new Calculator(previousOperandElement, currentOperandElement);

// Event Listeners
numberButtons.forEach(button => {
    button.addEventListener('click', () => {
        calculator.appendNumber(button.innerText);
        calculator.updateDisplay();
    });
});

operationButtons.forEach(button => {
    button.addEventListener('click', () => {
        calculator.chooseOperation(button.innerText);
        calculator.updateDisplay();
    });
});

equalsButton.addEventListener('click', () => {
    calculator.compute();
    calculator.updateDisplay();
});

clearButton.addEventListener('click', () => {
    calculator.clear();
    calculator.updateDisplay();
});

deleteButton.addEventListener('click', () => {
    calculator.delete();
    calculator.updateDisplay();
});

decimalButton.addEventListener('click', () => {
    calculator.appendNumber('.');
    calculator.updateDisplay();
});

functionButtons.forEach(button => {
    button.addEventListener('click', () => {
        calculator.applyFunction(button.dataset.function);
        calculator.updateDisplay();
    });
});

parenButtons.forEach(button => {
    button.addEventListener('click', () => {
        calculator.addParenthesis(button.dataset.paren);
        calculator.updateDisplay();
    });
});

toggleModeButton.addEventListener('click', () => {
    document.body.classList.toggle('dark-mode');
    const icon = toggleModeButton.querySelector('i');
    if (document.body.classList.contains('dark-mode')) {
        icon.classList.remove('fa-moon');
        icon.classList.add('fa-sun');
    } else {
        icon.classList.remove('fa-sun');
        icon.classList.add('fa-moon');
    }
});

// Keyboard support
document.addEventListener('keydown', (e) => {
    if (e.key >= 0 && e.key <= 9) {
        calculator.appendNumber(e.key);
        calculator.updateDisplay();
    } else if (e.key === '.') {
        calculator.appendNumber('.');
        calculator.updateDisplay();
    } else if (e.key === '+' || e.key === '-' || e.key === '*' || e.key === '/') {
        calculator.chooseOperation(
            e.key === '*' ? '×' : e.key === '/' ? '÷' : e.key
        );
        calculator.updateDisplay();
    } else if (e.key === 'Enter' || e.key === '=') {
        calculator.compute();
        calculator.updateDisplay();
    } else if (e.key === 'Backspace') {
        calculator.delete();
        calculator.updateDisplay();
    } else if (e.key === 'Escape') {
        calculator.clear();
        calculator.updateDisplay();
    }
});
    </script>
